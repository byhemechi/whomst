apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - namespace.yaml
images:
  - name: whomst
replacements:
  - source:
      fieldPath: metadata.name
      kind: Service
      name: whomst
    targets:
      - fieldPaths:
          - spec.rules.*.backendRefs.[name=svc].name
        select:
          kind: HTTPRoute
          name: route
namespace: whomst
labels:
  - includeSelectors: true
    pairs:
      app: whomst
